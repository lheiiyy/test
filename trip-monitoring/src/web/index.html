<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trips · Trip Monitoring</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <h1>Trip Monitoring</h1>
  <div id="switcher"></div>
</header>
<main>
  <div id="messages"></div>
  <h2>Trips</h2>
  <div class="toolbar">
    <div class="field">
      <label for="status-filter">Status</label>
      <select id="status-filter">
        <option value="">All</option><option>Draft</option><option>Submitted</option>
        <option>Trip validated</option><option>Completed</option>
      </select>
    </div>
    <a class="btn" id="new-trip" href="trip.html">New trip</a>
  </div>
  <div id="list" aria-live="polite"></div>
</main>
<script src="seed.js"></script>
<script src="app.js"></script>
<script>
  const { $, el, message, roleSwitcher } = window.TM;
  window.TM.start((api) => {
    const filter = $('#status-filter');
    function render() {
      const box = $('#list');
      message('');
      box.replaceChildren(el('p', {}, 'Loading trips…'));
      const res = api.listTrips(filter.value ? { status: filter.value } : {});
      if (!res.ok) { box.replaceChildren(); message(res.error, 'error'); return; }
      $('#new-trip').hidden = !['requestor', 'driver', 'admin'].includes(api.currentUser().role);
      if (!res.data.length) {
        box.replaceChildren(el('div', { class: 'card' }, 'No trips to show. ',
          $('#new-trip').hidden ? 'Trips appear here once a requestor submits one.' : 'Use "New trip" to start one.'));
        return;
      }
      const lk = api.lookups().data;
      const name = (rows, id) => (rows.find((r) => r.id === id) || {});
      box.replaceChildren(el('table', {},
        el('thead', {}, el('tr', {}, ['Trip', 'Purpose', 'Vehicle', 'Requestor', 'Status', ''].map((h) => el('th', { scope: 'col' }, h)))),
        el('tbody', {}, res.data.map((t) => el('tr', {},
          el('td', { 'data-label': 'Trip', class: 'mono' }, t.id),
          el('td', { 'data-label': 'Purpose' }, t.purpose),
          el('td', { 'data-label': 'Vehicle' }, name(lk.vehicles, t.vehicle_id).plate || t.vehicle_id),
          el('td', { 'data-label': 'Requestor' }, name(lk.users, t.requestor_id).name || t.requestor_id),
          el('td', { 'data-label': 'Status' }, el('span', { class: 'badge ' + t.status }, t.status)),
          el('td', {}, el('a', { href: 'trip.html?id=' + encodeURIComponent(t.id) }, 'Open')))))));
    }
    $('#switcher').append(roleSwitcher(api, render));
    filter.addEventListener('change', render);
    render();
  });
</script>
</body>
</html>
